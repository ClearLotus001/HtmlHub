﻿version: '3.8'

# HtmlHub 内网单机部署
# 使用方法：在项目根目录执行 `docker compose -f deploy/docker-compose.yml up -d --build`

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: htmlhub-api:latest
    restart: unless-stopped
    environment:
      PORT: 3001
      DATA_DIR: /data
      # 自动清理相关（可按需覆盖）
      CLEANUP_ENABLED: 'true'
      CLEANUP_CRON: '0 0 2 * * *'
      CLEANUP_RETAIN_DAYS: '90'
      TRASH_RETAIN_DAYS: '7'
    volumes:
      - htmlreport-data:/data
    expose:
      - '3001'
    networks:
      - htmlhub

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: htmlhub-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # 生产通过 Nginx 反代时前端无需知道后端地址；dev rewrites 兜底
      NEXT_PUBLIC_API_TARGET: http://api:3001
    expose:
      - '3000'
    depends_on:
      - api
    networks:
      - htmlhub

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # 内网访问端口，按需修改
      - '8088:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 复用同一个卷直接读报告文件，提升静态性能
      - htmlreport-data:/data:ro
    depends_on:
      - api
      - web
    networks:
      - htmlhub

volumes:
  htmlreport-data:
    # 持久化报告与数据库
    # 如需映射到主机目录，替换为 driver_opts bind 方式即可

networks:
  htmlhub:
    driver: bridge
