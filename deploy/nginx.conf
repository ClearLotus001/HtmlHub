# HtmlReport Nginx 反向代理配置
# 约定：
#   /              -> Next.js 前端（web:3000）
#   /api           -> NestJS 后端（api:3001）
#   /reports       -> 静态报告目录（由 Nginx 直接服务，效率最优）

# 上传体积上限需略大于 zip 限制
client_max_body_size 220m;

# 报告目录 —— 由容器挂载卷提供
# 直接托管静态，不再走 NestJS 的 ServeStatic
map $uri $report_path {
    default "";
}

server {
    listen 80;
    server_name _;

    # --- 全局安全头 ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # --- 1) /reports/**：静态报告（严格 CSP） ---
    location /reports/ {
        alias /data/reports/;

        # 禁止列目录
        autoindex off;

        # 防嵌入其他网站
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        # CSP：允许报告内自带的内联资源和相对资源，禁止外部网络请求
        # 'self' 涵盖同源；inline 给报告内 <style>/<script> 使用；connect 禁止 fetch 外网
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none';" always;

        # 缓存：HTML 不缓存，静态资源短缓存
        location ~* \.(html|htm)$ {
            alias /data/reports/;
            try_files $uri =404;
            add_header Cache-Control "no-store" always;
        }

        location ~* \.(png|jpg|jpeg|gif|webp|svg|mp4|webm|woff2?|ttf|css|js)$ {
            alias /data/reports/;
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public, max-age=3600" always;
        }
    }

    # --- 2) /api/**：后端 API ---
    location /api/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 上传大文件：增大超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
    }

    # --- 3) 其他请求：前端 ---
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
